# FastAPI only. Postgres lives in the dicejobmanager-postgres repo.
# API: docker compose up -d

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dicejobmanager-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_MODE: local
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@192.168.0.45:5432/dicejobmanager
    secrets:
      - aws_access_key_id
      - aws_secret_access_key
      - aws_session_token
    ports:
      - "8001:8000"
    volumes:
      - ./:/app
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]

secrets:
  aws_access_key_id:
    file: ./secrets/aws_access_key_id
  aws_secret_access_key:
    file: ./secrets/aws_secret_access_key
  aws_session_token:
    file: ./secrets/aws_session_token
