services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dicejobmanager-app
    restart: unless-stopped
    # No local postgres dependency: connect to external DB via env/config
    env_file:
      - .env
    secrets:
      - aws_access_key_id
      - aws_secret_access_key
      - aws_session_token
    ports:
      - "8001:8000"
    volumes:
      - ./:/app
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  dicejobmanager-data:

secrets:
  aws_access_key_id:
    file: ./secrets/aws_access_key_id
  aws_secret_access_key:
    file: ./secrets/aws_secret_access_key
  aws_session_token:
    file: ./secrets/aws_session_token