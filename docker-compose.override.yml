services:
  postgres:
    image: postgres:17
    container_name: dicejobmanager-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: dicejobmanager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - dicejobmanager-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d

  app:
    depends_on:
      - postgres
    environment:
      # ensure the app uses local DB when running with this override
      DATABASE_MODE: local

volumes:
  dicejobmanager-data:
